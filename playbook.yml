---
- name: Setup DHIS2 Security Reporting
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    telegram_bot_token: "{{ bot_token | default('YOUR_BOT_TOKEN') }}"
    telegram_chat_id: "{{ chat_id | default('YOUR_CHAT_ID') }}"
    alert_time: "{{ alert_time_input | default('07:00') }}"
    alert_hour: "{{ alert_time.split(':')[0] }}"
    alert_minute: "{{ alert_time.split(':')[1] | default('00') }}"
    security_monitor_dir: /opt/security-monitor
    containers:
      dhis: dhis
      proxy: proxy
      postgres: postgres
      monitor: monitor

  handlers:
    - name: Test monitoring
      ansible.builtin.command: "{{ security_monitor_dir }}/security-check.sh"
      changed_when: false
      failed_when: false

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - logwatch
          - curl
          - jq
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create monitoring directory
      ansible.builtin.file:
        path: "{{ security_monitor_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Deploy security check script
      ansible.builtin.copy:
        dest: "{{ security_monitor_dir }}/security-check.sh"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -euo pipefail

          DATE=$(date '+%Y-%m-%d %H:%M')
          HOSTNAME=$(hostname -f)
          REPORT="/tmp/security-report-$(date +%Y%m%d).txt"

          # Header
          echo "DHIS2 Security Report - $HOSTNAME" > "$REPORT"
          echo "$DATE" >> "$REPORT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> "$REPORT"

          # Check proxy container (nginx)
          echo -e "\nPROXY (Nginx)" >> "$REPORT"
          lxc exec proxy -- bash -c "
            # Check for HTTP errors
            grep -E '(4[0-9]{2}|5[0-9]{2})' /var/log/nginx/access.log 2>/dev/null | tail -5 | sed 's/^/  /'
            # Check error log
            grep -iE 'error|alert|crit' /var/log/nginx/error.log 2>/dev/null | tail -5 | sed 's/^/  /'
          " >> "$REPORT" 2>/dev/null || echo "  No issues" >> "$REPORT"

          # SQL injection attempts in nginx
          SQLI=$(lxc exec proxy -- grep -cE "(union.*select|drop.*table|<script|javascript:|onerror=)" /var/log/nginx/access.log 2>/dev/null || echo 0)
          [ "$SQLI" -gt 0 ] && echo "  SQL injection attempts: $SQLI" >> "$REPORT"

          # Check DHIS container
          echo -e "\nDHIS Application" >> "$REPORT"
          lxc exec dhis -- bash -c "
            # Detect tomcat version (tomcat9 for Ubuntu 22.04, tomcat10 for Ubuntu 24.04)
            if systemctl list-units --all | grep -q tomcat10; then
              TOMCAT_SERVICE='tomcat10'
            else
              TOMCAT_SERVICE='tomcat9'
            fi

            # Check tomcat logs for authentication and authorization issues, errors, and exceptions
            journalctl -u "$TOMCAT_SERVICE" --since '24 hours ago' 2>/dev/null | \
              grep -iE 'authentication.*fail|unauthorized|forbidden|error|exception' | \
              tail -10 | cut -c1-160 | sed 's/^/  /'
            # Also check /opt/dhis2/logs if it exists, limit output line length
            if [ -d /opt/dhis2/logs ]; then
              grep -iE 'authentication.*fail|unauthorized|forbidden' /opt/dhis2/logs/*.log 2>/dev/null | \
                tail -5 | cut -c1-160 | sed 's/^/  /'
            fi
          " >> "$REPORT" 2>/dev/null || echo "  No issues" >> "$REPORT"

          # Failed login count from journalctl (detect tomcat version)
          FAILED_LOGINS=$(lxc exec dhis -- bash -c "
            if systemctl list-units --all | grep -q tomcat10; then
              journalctl -u tomcat10 --since '24 hours ago' 2>/dev/null | grep -c 'authentication.*fail' || echo 0
            else
              journalctl -u tomcat9 --since '24 hours ago' 2>/dev/null | grep -c 'authentication.*fail' || echo 0
            fi
          ")
          [ "$FAILED_LOGINS" -gt 10 ] && echo "  High failed logins: $FAILED_LOGINS" >> "$REPORT"

          # Check PostgreSQL container
          echo -e "\nPostgreSQL" >> "$REPORT"
          lxc exec postgres -- bash -c "
            # Check PostgreSQL logs (version agnostic)
            find /var/log/postgresql -name '*.log' -exec grep -iE 'FATAL|ERROR.*authentication|permission denied' {} \; 2>/dev/null | tail -5 | sed 's/^/  /'
            # Also check journal
            journalctl -u postgresql --since '24 hours ago' 2>/dev/null | grep -iE 'fatal|error' | tail -5 | sed 's/^/  /'
          " >> "$REPORT" 2>/dev/null || echo "  No issues" >> "$REPORT"

          # System health checks
          echo -e "\nSystem Health" >> "$REPORT"

          # Check container status
          for container in dhis proxy postgres monitor; do
            STATUS=$(lxc list "^${container}$" --format csv -c s 2>/dev/null | head -1)
            [ "$STATUS" != "RUNNING" ] && echo "  $container: $STATUS" >> "$REPORT"
          done

          echo -e "\n━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> "$REPORT"

          # Send to Telegram
          {{ security_monitor_dir }}/send-telegram.sh "$REPORT"
      notify: Test monitoring

    - name: Deploy Telegram sender script
      ansible.builtin.copy:
        dest: "{{ security_monitor_dir }}/send-telegram.sh"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          REPORT="$1"
          TOKEN="{{ telegram_bot_token }}"
          CHAT_ID="{{ telegram_chat_id }}"

          # Send summary (first 30 lines for better visibility)
          TEXT=$(head -30 "$REPORT")
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" > /dev/null 2>&1

          # Send full report as document if there are critical issues
          if grep -qE "High failed logins|SQL injection|Failed services|Disk usage" "$REPORT"; then
            curl -s -F "chat_id=${CHAT_ID}" \
              -F "document=@${REPORT}" \
              -F "caption=Full Security Report - Critical Issues Detected" \
              "https://api.telegram.org/bot${TOKEN}/sendDocument" > /dev/null 2>&1
          fi

          # Cleanup old reports
          find /tmp -name "security-report-*.txt" -mtime +7 -delete 2>/dev/null

    - name: Setup daily security check cron job
      ansible.builtin.cron:
        name: "DHIS2 Daily Security Check"
        minute: "{{ alert_minute }}"
        hour: "{{ alert_hour }}"
        job: "{{ security_monitor_dir }}/security-check.sh"
        user: root
        state: present

    - name: Setup hourly critical check using journalctl
      ansible.builtin.cron:
        name: "DHIS2 Hourly Critical Check"
        minute: "0"
        hour: "*"
        job: 'lxc exec dhis -- bash -c "if systemctl list-units --all | grep -q tomcat10; then T=tomcat10; else T=tomcat9; fi; ERRORS=\$(journalctl -u \$T --since \"1 hour ago\" 2>/dev/null | grep -E \"ERROR|FATAL|CRITICAL\" | wc -l); if [ \$ERRORS -gt 50 ]; then echo \"Critical: \$ERRORS errors in DHIS2 last hour\" | {{ security_monitor_dir }}/send-telegram.sh /dev/stdin; fi"'
        user: root
        state: present

    - name: Configure logwatch for DHIS2
      ansible.builtin.copy:
        dest: /etc/logwatch/conf/services/dhis2-security.conf
        content: |
          Title = "DHIS2 Security"
          LogFile = messages
        owner: root
        group: root
        mode: "0644"

    - name: Validate Telegram credentials
      ansible.builtin.assert:
        that:
          - telegram_bot_token != "YOUR_BOT_TOKEN"
          - telegram_chat_id != "YOUR_CHAT_ID"
        fail_msg: "Please configure Telegram credentials: bot_token and chat_id"
        success_msg: "Telegram credentials configured"
      failed_when: false
      register: telegram_validation

    - name: Warn about missing Telegram configuration
      ansible.builtin.debug:
        msg: "WARNING: Telegram credentials not configured. Please set bot_token and chat_id"
      when: telegram_validation.failed | default(false)

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "Security monitoring configured successfully!"
          - "Daily reports at: {{ alert_time }} ({{ alert_hour }}:{{ alert_minute }})"
          - "Hourly critical checks enabled (every hour at minute 0)"
          - "Manual check: {{ security_monitor_dir }}/security-check.sh"
          - ""
          - "Log locations being monitored:"
          - "  Nginx: /var/log/nginx/access.log and error.log in proxy container"
          - "  DHIS2: journalctl -u tomcat9/tomcat10 (auto-detected) in dhis container"
          - "  PostgreSQL: /var/log/postgresql/*.log in postgres container"
